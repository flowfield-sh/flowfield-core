name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLOWFIELD_UPDATE_CHECKS: '0'
  UV_NO_SYNC: '1'

jobs:
  backend:
    name: Python 3.12 / ${{ matrix.scope }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            scope: full Linux suite
            selection: ''
          - os: macos-15
            scope: macOS platform boundaries
            selection: '@tests/macos-platform.txt'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.26'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.19.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Select the pinned runtime compiler
        run: echo "FLOWFIELD_BUILD_BUN=$(command -v bun)" >> "$GITHUB_ENV"
      - run: uv sync --locked
      - run: pnpm --dir runtimes/claude-sdk install --frozen-lockfile --ignore-scripts
      - run: node runtimes/claude-sdk/build.mjs --host
      - name: Check the selected platform coverage
        env:
          TEST_SELECTION: ${{ matrix.selection }}
        run: |
          args=()
          if [ -n "$TEST_SELECTION" ]; then args+=("$TEST_SELECTION"); fi
          uv run --no-sync pytest "${args[@]}"
      - name: Check native cleanup and tool details
        if: matrix.os == 'ubuntu-24.04'
        run: node --test runtimes/claude-sdk/cleanup.test.mjs runtimes/claude-sdk/tool-details.test.mjs

  quality:
    name: Quality, docs and candidate build
    outputs:
      artifact_id: ${{ steps.candidate.outputs.artifact-id }}
      version: ${{ steps.identity.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.26'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.19.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - run: echo "FLOWFIELD_BUILD_BUN=$(command -v bun)" >> "$GITHUB_ENV"
      - run: make setup
      - name: Python quality and API contract
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .
          uv run --no-sync mypy
          uv run --no-sync python scripts/generate-api-types.py --check
      - run: pnpm --dir web check
      - run: make docs
      - run: make build
      - run: uv publish --dry-run --trusted-publishing never dist/*.whl dist/*.tar.gz
      - name: Record candidate identity and original file hashes
        id: identity
        run: uv run --no-sync python scripts/release.py --build-candidate .work/release-candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: candidate
        with:
          name: release-candidate-${{ github.run_attempt }}
          path: .work/release-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  browser:
    name: Browser journeys / ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.26'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.19.0'
      - run: uv sync --locked
      - run: pnpm --dir web install --frozen-lockfile
      - name: Install browser system dependencies
        timeout-minutes: 5
        run: |
          # The hosted Azure mirror can throttle downloads for many minutes.
          # Keep Ubuntu signature verification and use its primary archive.
          sudo sed -i 's|https\?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          pnpm --dir web exec playwright install-deps chromium firefox
      - name: Install browser binaries
        timeout-minutes: 5
        run: pnpm --dir web exec playwright install --no-shell chromium firefox
      - run: pnpm --dir web build
      - name: Check browser fixture lifecycle once
        if: matrix.shard == 1
        run: pnpm --dir web test:fixtures
      - run: pnpm --dir web exec playwright test --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: browser-failures-${{ matrix.shard }}
          path: web/test-results/
          retention-days: 7

  native:
    name: Native adapters / Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.26'
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.19.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Select the pinned runtime compiler
        run: echo "FLOWFIELD_BUILD_BUN=$(command -v bun)" >> "$GITHUB_ENV"
      - run: uv sync --locked
      - run: pnpm --dir runtimes/claude-sdk install --frozen-lockfile --ignore-scripts
      - run: node runtimes/claude-sdk/build.mjs --host
      - run: uv run --no-sync pytest @tests/native-platform.txt

  installed:
    name: Candidate installs / ${{ matrix.os }}
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.quality.outputs.artifact_id }}
          merge-multiple: true
      - name: Verify original artifact bytes
        working-directory: dist
        run: shasum -a 256 -c ../SHA256SUMS
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.26'
          python-version: '3.12'
      - name: Exercise wheel, source and uv tool installs outside the checkout
        env:
          RELEASE_VERSION: ${{ needs.quality.outputs.version }}
        run: uv run --no-project --with packaging --python 3.12 python scripts/check_dist.py --version "$RELEASE_VERSION"

  checked:
    name: All checks passed
    if: always()
    needs: [backend, quality, browser, native, installed]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check
        env:
          BACKEND: ${{ needs.backend.result }}
          QUALITY: ${{ needs.quality.result }}
          BROWSER: ${{ needs.browser.result }}
          NATIVE: ${{ needs.native.result }}
          INSTALLED: ${{ needs.installed.result }}
        run: test "$BACKEND" = success && test "$QUALITY" = success && test "$BROWSER" = success && test "$NATIVE" = success && test "$INSTALLED" = success
