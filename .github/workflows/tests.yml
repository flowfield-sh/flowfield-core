name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLOWFIELD_UPDATE_CHECKS: '0'
  UV_NO_SYNC: '1'

jobs:
  backend:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.26'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.19.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Select the pinned runtime compiler
        run: echo "FLOWFIELD_BUILD_BUN=$(command -v bun)" >> "$GITHUB_ENV"
      - run: uv sync --locked
      - run: pnpm --dir runtimes/claude-sdk install --frozen-lockfile --ignore-scripts
      - run: node runtimes/claude-sdk/build.mjs --host
      - run: uv run --no-sync pytest

  quality:
    name: Quality, docs and installed packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.26'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.19.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - run: echo "FLOWFIELD_BUILD_BUN=$(command -v bun)" >> "$GITHUB_ENV"
      - run: make setup
      - name: Python quality and API contract
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .
          uv run --no-sync mypy
          uv run --no-sync python scripts/generate-api-types.py --check
      - run: pnpm --dir web check
      - run: node --test runtimes/claude-sdk/cleanup.test.mjs
      - run: make docs
      - run: make build check-dist
      - run: uv publish --dry-run --trusted-publishing never dist/*.whl dist/*.tar.gz

  browser:
    name: Chromium journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.26'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.19.0'
      - run: uv sync --locked
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps --no-shell chromium
      - run: make smoke
      - name: Repeat native-tab regression without retries
        run: pnpm --dir web exec playwright test e2e/native-tabs.spec.ts --repeat-each=10 --output=test-results/native-tabs-stress
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: browser-failures
          path: web/test-results/
          retention-days: 7

  native:
    name: Native adapters / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.26'
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.19.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Select the pinned runtime compiler
        run: echo "FLOWFIELD_BUILD_BUN=$(command -v bun)" >> "$GITHUB_ENV"
      - run: uv sync --locked
      - run: pnpm --dir runtimes/claude-sdk install --frozen-lockfile --ignore-scripts
      - run: node runtimes/claude-sdk/build.mjs --host
      - run: node --test runtimes/claude-sdk/cleanup.test.mjs
      - run: uv run --no-sync pytest tests/test_native_adapters.py tests/test_claude_agent.py tests/test_local_execution.py

  checked:
    name: All checks passed
    if: always()
    needs: [backend, quality, browser, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check
        env:
          BACKEND: ${{ needs.backend.result }}
          QUALITY: ${{ needs.quality.result }}
          BROWSER: ${{ needs.browser.result }}
          NATIVE: ${{ needs.native.result }}
        run: test "$BACKEND" = success && test "$QUALITY" = success && test "$BROWSER" = success && test "$NATIVE" = success
