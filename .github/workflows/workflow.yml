name: Release

on:
  push:
    tags: ['v*']
  # Exercise promotion only: manual runs never tag or publish.
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful Tests run for this exact main commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLOWFIELD_UPDATE_CHECKS: '0'
  UV_NO_SYNC: '1'

jobs:
  promote:
    name: Verify candidate promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.originals.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.26'
          python-version: '3.12'
      - name: Verify successful candidate, source, attempt and original artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          args=()
          if [ -n "$CANDIDATE_RUN" ]; then args+=(--candidate-run "$CANDIDATE_RUN"); fi
          uv run --no-project --python 3.12 python scripts/release.py --promote-ci .work/promoted "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: originals
        with:
          name: release-assets-${{ github.run_attempt }}
          path: .work/promoted/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Record promotion receipt
        run: cat .work/promoted/candidate.json >> "$GITHUB_STEP_SUMMARY"

  pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/flowfield-core/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.promote.outputs.artifact_id }}
          merge-multiple: true
      - name: Verify original artifact bytes
        working-directory: dist
        run: shasum -a 256 -c ../SHA256SUMS
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.26'
      - name: Publish verified distributions; identical files may be retried
        run: >-
          uv publish --trusted-publishing always
          --publish-url https://upload.pypi.org/legacy/
          --check-url https://pypi.org/simple dist/*.whl dist/*.tar.gz

  github:
    needs: [promote, pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.promote.outputs.artifact_id }}
          merge-multiple: true
      - name: Verify original artifact bytes
        working-directory: dist
        run: shasum -a 256 -c ../SHA256SUMS
      - name: Publish GitHub Release after PyPI succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Flowfield $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --notes-file release-notes.md
          printf 'Published flowfield-core and GitHub release %s\n' "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
